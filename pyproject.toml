[project]
name = "tide-tooling"
version = "0.0.4"
description = "Queryable execution provenance for Python"
readme = "README.md"
authors = [
    { name = "Gabriel Dolbear", email = "tidetooling@gmail.com" },
]
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENCE.md"]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]
now = [
    "noworkflow>=2.1.3",
]
signing = [
    "cryptography>=46.0.0",
]

[project.urls]
Repository = "https://github.com/tnkinobirb/TIDE-Tooling"

[project.scripts]
tide = "tide_tooling.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tide_tooling*"]

[tool.pytest.ini_options]
testpaths = ["testing"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
